apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kueue-resources
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/devam1402/cloud-native-inference-platform.git
    targetRevision: main
    path: gitops/kueue-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
