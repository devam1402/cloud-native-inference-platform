apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: cpu-default
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: finance-cluster-queue
spec:
  cohortName: cnip-cohort
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: cpu-default
      resources:
      - name: "cpu"
        nominalQuota: 2
        borrowingLimit: 2
      - name: "memory"
        nominalQuota: 4Gi
        borrowingLimit: 4Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: research-cluster-queue
spec:
  cohortName: cnip-cohort
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: cpu-default
      resources:
      - name: "cpu"
        nominalQuota: 2
        borrowingLimit: 2
      - name: "memory"
        nominalQuota: 4Gi
        borrowingLimit: 4Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: platform-interactive
value: 1000
description: "Interactive InferenceServices — highest scheduling priority"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: platform-batch
value: 333
description: "Batch InferenceServices — medium scheduling priority"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: platform-background
value: 100
description: "Background InferenceServices — lowest scheduling priority"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: mig-3g-40gb
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector: {}
  admissionChecksStrategy:
    admissionChecks:
    - name: gpu-multikueue-check
      onFlavors:
      - gpu-default
      - mig-3g-40gb
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    - nvidia.com/gpu
    flavors:
    - name: gpu-default
      resources:
      - name: cpu
        nominalQuota: 24
      - name: memory
        nominalQuota: 196Gi
      - name: nvidia.com/gpu
        nominalQuota: "1"
  - coveredResources:
    - nvidia.com/mig-3g.40gb
    flavors:
    - name: mig-3g-40gb
      resources:
      - name: nvidia.com/mig-3g.40gb
        nominalQuota: "2"
